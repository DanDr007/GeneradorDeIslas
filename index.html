<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terreno Básico Three.js</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87ceeb;
        }

        canvas {
            display: block;
        }

        #controls-panel {
            position: fixed;
            z-index: 1;
            top: 16px;
            left: 16px;
            width: 260px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 18px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2933;
            font: 14px/1.4 system-ui, sans-serif;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
        }

        #controls-panel h1 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        #controls-panel label {
            display: block;
            margin: 14px 0 5px;
            font-weight: 600;
        }

        #controls-panel input[type="range"],
        #controls-panel input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }

        #controls-panel input[type="text"] {
            padding: 7px;
        }

        #controls-panel button {
            margin-top: 10px;
            padding: 8px 10px;
            border: 0;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #controls-panel button:hover {
            background: #1d4ed8;
        }

        #random-seed {
            margin-left: 5px;
            background: #475569;
        }

        #random-seed:hover {
            background: #334155;
        }

        @media (max-width: 520px) {
            #controls-panel {
                top: 8px;
                left: 8px;
                width: min(260px, calc(100vw - 16px));
                max-height: 48vh;
            }
        }
    </style>
</head>
<body>

<aside id="controls-panel" aria-label="Controles del terreno">
    <h1>Generador de terreno</h1>

    <label for="water-level">Nivel del agua: <output id="water-value">5</output></label>
    <input id="water-level" type="range" min="-10" max="80" step="1" value="5">

    <label for="roundness">Redondez de la isla: <output id="roundness-value">50</output>%</label>
    <input id="roundness" type="range" min="0" max="100" step="1" value="50">

    <label for="seed">Semilla</label>
    <input id="seed" type="text" value="MiIsla123" maxlength="40">
    <button id="generate-terrain" type="button">Generar terreno</button>
    <button id="random-seed" type="button">Semilla aleatoria</button>
</aside>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createNoise2D } from 'https://esm.sh/simplex-noise@4.0.1';

const waterLevelInput = document.querySelector('#water-level');
const waterValue = document.querySelector('#water-value');
const roundnessInput = document.querySelector('#roundness');
const roundnessValue = document.querySelector('#roundness-value');
const seedInput = document.querySelector('#seed');
const generateButton = document.querySelector('#generate-terrain');
const randomSeedButton = document.querySelector('#random-seed');

function mulberry32(seed) {
    return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function stringToSeed(str) {
    let h = 0;

    for (let i = 0; i < str.length; i++) {
        h = Math.imul(31, h) + str.charCodeAt(i);
    }

    return h >>> 0;
}
let random = mulberry32(stringToSeed(seedInput.value));
let noise = createNoise2D(random);

// Escena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// Cámara
const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    4000
);

camera.position.set(0, 40, 600);
camera.lookAt(0, 0, 0);

// Renderizador
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;

// Luz ambiental
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// Luz direccional
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 20);
scene.add(sun);

// Geometría del terreno
const terrainGeometry = new THREE.PlaneGeometry(
    1000, // ancho
    1000, // largo
    100, // segmentos X
    100  // segmentos Y
);
function generarCentrosDunas(cantidad = 10, size = 101) {

    const dunas = [];

    for (let i = 0; i < cantidad; i++) {

        dunas.push({
            x: Math.floor(random() * size),
            y: Math.floor(random() * size),
            altura: Math.floor(random() * 10) + 20,
            radio: Math.floor(random() * 50) + 100
        });

    }

    return dunas;
}

function generarCentrosMontanas(cantidad = 10) {

    const montanas = [];

    for (let i = 0; i < cantidad; i++) {

        montanas.push({
            x: Math.floor(random() * 101),
            y: Math.floor(random() * 101),
            altura: Math.floor(random() * 30) + 20,
            radio: Math.floor(random() * 50) + 100
        });

    }

    for (let i = 0; i < cantidad; i++) {

        montanas.push({
            x: Math.floor(random() * 101),
            y: Math.floor(random() * 101),
            altura: Math.floor(random() * 100) + 100,
            radio: Math.floor(random() * 20) + 30
        });

    }

    return montanas;
}
function mountain(x, y, mountainX, mountainY, height, radius) {

    const dx = x - mountainX;
    const dy = y - mountainY;

    let h = height * Math.exp(
        -(dx * dx + dy * dy) / (2 * radius * radius)
    );

    h += noise(x * 0.01, y * 0.01) * 3;

    return h;
}
const vertices = terrainGeometry.attributes.position;

// Material
const terrainMaterial = new THREE.MeshStandardMaterial({
    color: 0x7D6B53 // Roca gris-marrón
,
    flatShading: false
});

// Malla
const terrain = new THREE.Mesh(
    terrainGeometry,
    terrainMaterial
);

terrain.rotation.x = -Math.PI / 2;

scene.add(terrain);
//arena
const arenaGeometry = new THREE.PlaneGeometry(
    1000,
    1000,
    100,
    100
);

const arenaMaterial = new THREE.MeshPhongMaterial({
    color: 0xE2C17A // arena
});

const arena = new THREE.Mesh(
    arenaGeometry,
    arenaMaterial
);

arena.rotation.x = -Math.PI / 2;

// Un poco por encima del agua
arena.position.y = 0.1;

scene.add(arena);
const verticesA = arenaGeometry.attributes.position;
//el agua
const aguaGeometry = new THREE.PlaneGeometry(
    1000, // ancho
    1000, // largo
    1,
    1
);

const aguaMaterial = new THREE.MeshPhongMaterial({
    color: 0x3399ff,
    transparent: true,
    opacity: 0.7
});

const agua = new THREE.Mesh(
    aguaGeometry,
    aguaMaterial
);

agua.rotation.x = -Math.PI / 2;

scene.add(agua);

function smoothstep(edge0, edge1, value) {
    const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
}

function rebuildTerrain(seedText) {
    random = mulberry32(stringToSeed(seedText));
    noise = createNoise2D(random);

    const montanas = generarCentrosMontanas(5);
    const dunas = generarCentrosDunas(6);
    const roundness = Number(roundnessInput.value) / 100;

    for (let i = 0; i < vertices.count; i++) {
        const x = vertices.getX(i);
        const y = vertices.getY(i);
        let altura = 0;

        for (const m of montanas) {
            altura += mountain(
                x,
                y,
                (m.x - 50) * 5,
                (m.y - 50) * 5,
                m.altura,
                m.radio
            );
        }

        const distanciaNormalizada = Math.hypot(x, y) / 500;
        const borde = smoothstep(0.6, 1, distanciaNormalizada);
        const alturaBase = altura > 30 ? altura : -5;
        vertices.setZ(i, -5 + (alturaBase + 5) * (1 - roundness * borde));
    }

    for (let i = 0; i < verticesA.count; i++) {
        const x = verticesA.getX(i);
        const y = verticesA.getY(i);
        let altura = 0;

        for (const d of dunas) {
            const centroX = (d.x - 50) * 6;
            const centroY = (d.y - 50) * 6;

            if (Math.hypot(x - centroX, y - centroY) > d.radio * 3) continue;

            altura += mountain(x, y, centroX, centroY, d.altura, d.radio);
        }

        const distanciaNormalizada = Math.hypot(x, y) / 500;
        const borde = smoothstep(0.6, 1, distanciaNormalizada);
        const alturaBase = altura > 20 ? altura : -5;
        verticesA.setZ(i, -5 + (alturaBase + 5) * (1 - roundness * borde));
    }

    terrainGeometry.attributes.position.needsUpdate = true;
    terrainGeometry.computeVertexNormals();
    arenaGeometry.attributes.position.needsUpdate = true;
    arenaGeometry.computeVertexNormals();
}

waterLevelInput.addEventListener('input', () => {
    agua.position.y = Number(waterLevelInput.value);
    waterValue.value = waterLevelInput.value;
});

roundnessInput.addEventListener('input', () => {
    roundnessValue.value = roundnessInput.value;
    rebuildTerrain(seedInput.value);
});

generateButton.addEventListener('click', () => {
    rebuildTerrain(seedInput.value);
});

randomSeedButton.addEventListener('click', () => {
    seedInput.value = Math.floor(Math.random() * 4294967296).toString(36);
    rebuildTerrain(seedInput.value);
});

agua.position.y = Number(waterLevelInput.value);
rebuildTerrain(seedInput.value);

// Ejes para orientación (opcional)
const axes = new THREE.AxesHelper(20);
scene.add(axes);

// Render
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    
}

animate();

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
