<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terreno Básico Three.js</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87ceeb;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createNoise2D } from 'https://esm.sh/simplex-noise@4.0.1';


const noise = createNoise2D();

// Escena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// Cámara
const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    4000
);

camera.position.set(0, 40, 600);
camera.lookAt(0, 0, 0);

// Renderizador
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;

// Luz ambiental
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// Luz direccional
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 20);
scene.add(sun);

// Geometría del terreno
const terrainGeometry = new THREE.PlaneGeometry(
    1000, // ancho
    1000, // largo
    100, // segmentos X
    100  // segmentos Y
);
function generarCentrosDunas(cantidad = 10, tamaño = 101) {
    const mapa = Array.from(
    { length: tamaño },
    () => Array.from(
        { length: tamaño },
        () => [0, 0]
    )
);
    for (let i = 0; i < cantidad; i++) {
        const x = Math.floor(Math.random() * tamaño);
        const y = Math.floor(Math.random() * tamaño);

        mapa[y][x][0] = Math.floor(Math.random() * 10) + 20;  
        mapa[y][x][1] = Math.floor(Math.random() * 50) + 200;  
    }

    return mapa;
}
function generarCentrosMontanas(cantidad = 10, tamaño = 101) {
    const mapa = Array.from(
    { length: tamaño },
    () => Array.from(
        { length: tamaño },
        () => [0, 0]
    )
);
    for (let i = 0; i < cantidad; i++) {
        const x = Math.floor(Math.random() * tamaño);
        const y = Math.floor(Math.random() * tamaño);

        mapa[y][x][0] = Math.floor(Math.random() * 30) + 20;  
        mapa[y][x][1] = Math.floor(Math.random() * 50) + 100;  
    }
    for (let i = 0; i < cantidad; i++) {
        const x = Math.floor(Math.random() * tamaño);
        const y = Math.floor(Math.random() * tamaño);

        mapa[y][x][0] = Math.floor(Math.random() * 100) + 100;
        mapa[y][x][1] = Math.floor(Math.random() * 20) + 30;  
    }

    return mapa;
}
function mountain(x, y, mountainX, mountainY, height, radius) {

    const dx = x - mountainX;
    const dy = y - mountainY;

    let h = height * Math.exp(
        -(dx * dx + dy * dy) / (2 * radius * radius)
    );

    h += noise(x * 0.01, y * 0.01) * 3;

    return h;
}
const vertices = terrainGeometry.attributes.position;
console.log(vertices.count);
let mapa=generarCentrosMontanas(5, 101);
//console.log(mapa);

// Crear montaña central
for (let i = 0; i < vertices.count; i++) {

    const x = vertices.getX(i);
    const y = vertices.getY(i);

    let altura = 0;
    for (let j = 0; j < mapa.length; j++) {
        for (let k = 0; k < mapa[j].length; k++) {
            if (mapa[j][k][0] >1){
            altura += mountain(x, y, (j-50)*5, (k-50)*5, mapa[j][k][0],mapa[j][k][1]);
            }
        }
        
    }
    /*
    altura += mountain(x, y, 0, 0, 60, 35);
    altura += mountain(x, y, 30, 10, 45, 30);
    altura += mountain(x, y, -20, -15, 55, 20);*/

    vertices.setZ(i, altura>30 ? altura : 0);
}

terrainGeometry.computeVertexNormals();

// Material
const terrainMaterial = new THREE.MeshStandardMaterial({
    color: 0x7D6B53 // Roca gris-marrón
,
    flatShading: false
});

// Malla
const terrain = new THREE.Mesh(
    terrainGeometry,
    terrainMaterial
);

terrain.rotation.x = -Math.PI / 2;

scene.add(terrain);
//arena
const arenaGeometry = new THREE.PlaneGeometry(
    1000,
    1000,
    100,
    100
);

const arenaMaterial = new THREE.MeshPhongMaterial({
    color: 0xE2C17A // arena
});

const arena = new THREE.Mesh(
    arenaGeometry,
    arenaMaterial
);

arena.rotation.x = -Math.PI / 2;

// Un poco por encima del agua
arena.position.y = 0.1;

scene.add(arena);
const verticesA = arenaGeometry.attributes.position;
let mapaA=generarCentrosDunas(3, 101);
for (let i = 0; i < verticesA.count; i++) {
    const x = verticesA.getX(i);
    const y = verticesA.getY(i);

    let altura = 0;
    for (let j = 0; j < mapaA.length; j++) {
        for (let k = 0; k < mapaA[j].length; k++) {
            if (mapaA[j][k][0] >1){
            altura += mountain(x, y, (j-50)*6, (k-50)*6, mapaA[j][k][0],mapaA[j][k][1]);
            }
        }
        
    }
    verticesA.setZ(i, altura>20 ? altura : -1);
}
//el agua
const aguaGeometry = new THREE.PlaneGeometry(
    1000, // ancho
    1000, // largo
    1,
    1
);

const aguaMaterial = new THREE.MeshPhongMaterial({
    color: 0x3399ff,
    transparent: true,
    opacity: 0.7
});

const agua = new THREE.Mesh(
    aguaGeometry,
    aguaMaterial
);

agua.rotation.x = -Math.PI / 2;

// Nivel del mar
agua.position.y = 5;

scene.add(agua);
// Ejes para orientación (opcional)
const axes = new THREE.AxesHelper(20);
scene.add(axes);

// Render
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    
}

animate();

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
